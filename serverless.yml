service: task-management-api

provider:
  name: aws
  runtime: nodejs20.x

plugins:
  - serverless-plugin-typescript
  - serverless-offline

functions:
  createTask:
    handler: src/handlers/createTask.handler
    events:
      - http:
          path: tasks
          method: post

  getTasks:
    handler: src/handlers/getTasks.handler
    events:
      - http:
          path: tasks
          method: get
